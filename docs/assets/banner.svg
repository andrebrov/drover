<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">drover — a team of coding agents, one accountable loop</title><desc id="desc">Dispatch, build, cross-harness review and verified landing in Git worktrees.</desc><rect width="1200" height="300" rx="20" fill="#172b28"/><g fill="none" stroke="#405c51"><path d="M36 250H1164M36 50H1164"/><path d="M750 36V264"/></g><text x="56" y="115" fill="#f7f4e9" font-family="ui-monospace,monospace" font-size="58" font-weight="700">drover<tspan fill="#ee9c64">_</tspan></text><text x="60" y="167" fill="#f7f4e9" font-family="system-ui,sans-serif" font-size="25">A team of coding agents.</text><text x="60" y="204" fill="#a9c6b4" font-family="system-ui,sans-serif" font-size="25">One accountable loop.</text><g font-family="ui-monospace,monospace" font-size="17"><text x="794" y="93" fill="#a9c6b4">01 / dispatch</text><text x="794" y="133" fill="#a9c6b4">02 / build + test</text><text x="794" y="173" fill="#a9c6b4">03 / cross-harness review</text><text x="794" y="213" fill="#ee9c64">04 / prove the landing</text></g></svg>